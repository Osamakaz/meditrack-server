name: license-bot v2

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: license-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: python bot.py --once

      - name: Commit state
        run: |
          git config user.name "license-bot"
          git config user.email "license-bot@users.noreply.github.com"
          git add -f meditrack.db status.json
          git diff --cached --quiet || git commit -m "update license state"
          git push
